<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 5th Monthsary</title>
  
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* ===== RESET & BASE ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    /* Background pemandangan hijau buram (menggunakan gambar placeholder, bisa diganti) */
    background: linear-gradient(rgba(255,255,255,0.4), rgba(255,255,255,0.4)), 
                url('https://images.unsplash.com/photo-1501854140801-50d01698950b?q=80&w=1600&auto=format&fit=crop') center/cover fixed;
    font-family: 'Courier Prime', monospace; /* Font ala mesin tik */
    color: #7a203b; /* Warna maroon gelap sesuai gambar */
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    overflow-x: hidden;
  }

  .card-container {
    width: 100%;
    max-width: 650px;
    text-align: center;
    position: relative;
    animation: fadeIn 2s ease;
  }

  /* ===== HEADER TEXT ===== */
  .header-text {
    font-weight: bold;
    font-size: 1.1rem;
    letter-spacing: 1px;
    line-height: 1.6;
    margin-bottom: 15px;
  }
  .header-text .name { color: #d92b5d; } /* Warna pink cerah */

  /* ===== DATE BOX ===== */
  .date-box {
    display: inline-block;
    border: 2px solid #4a90e2; /* Biru sesuai gambar */
    padding: 2px 8px;
    margin-bottom: 20px;
    font-weight: bold;
    font-size: 1.1rem;
    letter-spacing: 2px;
    position: relative;
  }
  /* Efek seleksi teks biru */
  .date-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #a6c6f4;
    z-index: -1;
    opacity: 0.6;
  }

  /* ===== FOTO & FRAME ===== */
  .photos-wrapper {
    position: relative;
    padding: 10px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 1;
  }

  .photo-frame {
    background: #fff;
    padding: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    position: relative;
    width: 90%;
    max-width: 500px;
    aspect-ratio: 16/9;
    border: 4px solid #333; /* Border hitam tebal */
    transition: transform 0.5s ease;
  }
  
  .photo-frame:hover {
    transform: scale(1.02) rotate(-1deg);
  }

  .photo-frame img {
    width: 100%;
    height: auto;
    display: block;
    filter: grayscale(100%) contrast(1.1); /* Efek Hitam Putih */
  }

  /* Posisi foto atas dan bawah */
  .photo-top { transform: rotate(2deg); z-index: 2; }
  .photo-bottom { transform: rotate(-2deg); margin-top: -40px; margin-left: 40px; z-index: 1; }

  .gold-script {
    font-family: 'Great Vibes', cursive;
    color: #FFE253; 
    font-size: 5rem;
    line-height: 1;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    position: absolute;
    z-index: 3;
    pointer-events: none;
    width: 100%;
    left: 0;
  }
  .gold-top { top: -30px; transform: rotate(-5deg); }
  .gold-bottom { top: 50%; transform: translateY(-50%) rotate(-5deg); font-size: 4.5rem; }

  .heart {
    position: absolute;
    font-size: 24px;
    z-index: 4;
    animation: float 3s infinite alternate ease-in-out;
  }
  .heart-pink { color: #d92b5d; }
  .heart-yellow { color: #FFE253; }
  
  /* Posisi Hati */
  .h1 { top: 10%; left: 15%; animation-delay: 0s; }
  .h2 { top: 25%; right: 10%; animation-delay: 0.5s; font-size: 32px; }
  .h3 { top: 40%; left: 5%; animation-delay: 1s; color: #FFE253; }
  .h4 { bottom: 30%; left: 20%; animation-delay: 0.3s; }
  .h5 { bottom: 15%; right: 15%; animation-delay: 0.8s; font-size: 28px; }
  
  .sun-deco {
    position: absolute;
    top: 45%; left: -10px;
    font-size: 50px;
    color: #FFE253;
    z-index: 4;
    animation: spin 10s linear infinite;
  }

    .music-controls {
    margin-top: 30px;
    margin-bottom: 20px;
    display: flex;
    justify-content: center;
  }

  .btn-music {
    background: rgba(255, 255, 255, 0.8);
    border: 2px solid #d4af37; /* Border emas */
    color: #7a203b;
    padding: 12px 25px;
    font-family: 'Courier Prime', monospace;
    font-size: 1rem;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    transition: all 0.3s ease;
    backdrop-filter: blur(5px);
  }

  .btn-music:hover {
    transform: translateY(-3px) scale(1.05);
    background: #fff;
    box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4);
  }

  .btn-music.playing {
    background: #d4af37;
    color: #fff;
    border-color: #b8952e;
  }

  .btn-music .icon {
    font-size: 1.2rem;
  }

  /* Animasi berputar saat musik main */
  .btn-music.playing .icon {
    animation: spinMusic 2s linear infinite;
  }

  /* ===== ANIMASI TEKS BAWAH (TYPEWRITER) ===== */
  .footer-message {
    padding: 0 10px;
    font-size: 0.95rem;
    line-height: 1.6;
    color: #7a203b;
    font-weight: bold;
    min-height: 150px;
    position: relative;
    /* Teks awalnya disembunyikan atau berupa placeholder */
    opacity: 0.5; 
    transition: opacity 0.5s ease;
  }

  .footer-message.active {
    opacity: 1;
  }

  /* Kursor berkedip */
  .cursor {
    display: inline-block;
    width: 8px;
    height: 15px;
    background-color: #7a203b;
    margin-left: 2px;
    animation: blink 0.8s infinite;
    vertical-align: middle;
  }

  /* ===== KEYFRAMES ANIMASI ===== */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes float {
    0% { transform: translateY(0) scale(1); }
    100% { transform: translateY(-15px) scale(1.1); }
  }

  @keyframes spin {
    100% { transform: rotate(360deg); }
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* ===== RESPONSIVE (Untuk HP) ===== */
  @media (max-width: 600px) {
    .gold-script { font-size: 3.5rem; }
    .gold-bottom { font-size: 3rem; }
    .photo-frame { width: 90%; padding: 8px; }
    .photo-bottom { margin-left: 20px; margin-top: -20px; }
    .header-text { font-size: 0.9rem; }
    .sun-deco { font-size: 35px; left: -5px; }
    .heart { font-size: 18px; }
  }
</style>
</head>
<body>

<audio id="bg-music" loop>
  <source src="https://cdn.pixabay.com/audio/2026/02/02/audio_477097.mp3" type="audio/mpeg">
</audio>
  
<div class="card-container">
  
  <!-- Header Text -->
  <div class="header-text">
    To my dearest Kenzie<br>
    153 days together, with forever still ahead
  </div>

  <!-- Date Box -->
  <div class="date-box">26.5.2026</div>

  <!-- Area Foto & Teks Emas -->
  <div class="photos-wrapper">
    
    <!-- Teks Emas Atas -->
    <div class="gold-script gold-top">Happy 5th</div>

    <!-- Ornamen Hati & Matahari -->
    <div class="heart heart-pink h1">♥</div>
    <div class="heart heart-yellow h2">♥</div>
    <div class="heart heart-pink h3">♥</div>
    <div class="heart heart-yellow h4">♥</div>
    <div class="heart heart-pink h5">♥</div>
    <div class="sun-deco">☀</div>

    <!-- Foto Atas (Ganti src dengan foto cowok) -->
    <div class="photo-frame photo-top">
      <img src="kakkenzie.jpg" alt="kakak">
    </div>

    <!-- Teks Emas Bawah -->
    <div class="gold-script gold-bottom">Monthsary</div>

    <!-- Foto Bawah (Ganti src dengan foto cewek) -->
    <div class="photo-frame photo-bottom">
      <img src="meakugw.jpg" alt="aku">
    </div>

  </div>

  <div class="music-controls">
    <button id="music-btn" class="btn-music" onclick="toggleMusic()">
      <span class="icon">🎵</span>
      <span id="music-text">Click This!</span>
    </button>
  </div>

  <!-- TEKS PESAN (Di bawah tombol) -->
  <div class="footer-message" id="footer-message">
    <span id="typewriter-text"></span><span class="cursor hidden" id="cursor"></span>
  </div>


</div>

<script>
  const audio = document.getElementById('bg-music');
  const musicBtn = document.getElementById('music-btn');
  const musicText = document.getElementById('music-text');
  const icon = document.querySelector('#music-btn .icon');
  
  const footerMessage = document.getElementById('footer-message');
  const targetElement = document.getElementById('typewriter-text');
  const cursor = document.getElementById('cursor');
  
  const textToType = "Happy 5th monthsary, Sayangku... Five months may seem like a small chapter, but somehow you've become my favorite part of every day. Thank you for every laugh that stayed with me, every late-night conversation that healed me, and every little moment that made my heart feel at home. Loving you has been one of the gentlest things life has ever given me. I promise to keep choosing you, standing by you, and growing with you through every season. Here's to us, to countless memories still waiting to be made, and to a love that only grows deeper with time. I love you, always and endlessly, Kenzie.";

    let index = 0;
  const speed = 40; // Kecepatan mengetik
  let isTypingStarted = false;

  // Fungsi Animasi Mengetik
  function typeWriter() {
    if (index < textToType.length) {
      targetElement.innerHTML += textToType.charAt(index);
      index++;
      setTimeout(typeWriter, speed);
    } else {
      // Jika teks sudah selesai, kursor disembunyikan
      cursor.classList.add('hidden');
    }
  }

  // Fungsi Toggle Musik
  function toggleMusic() {
    if (audio.paused) {
      // Play musik
      audio.play().then(() => {
        musicBtn.classList.add('playing');
        musicText.textContent = "Jeda Musik";
        icon.textContent = "🎶";
        
        // Mulai ketik teks jika belum pernah dimulai
        if (!isTypingStarted) {
          isTypingStarted = true;
          footerMessage.classList.add('active');
          cursor.classList.remove('hidden');
          typeWriter();
        }
      }).catch(error => {
        alert("Gagal memutar musik. Pastikan file lagu-kita.mp3 ada di folder yang sama.");
        console.error(error);
      });
    } else {
      // Pause musik
      audio.pause();
      musicBtn.classList.remove('playing');
      musicText.textContent = "Lanjutkan Musik";
      icon.textContent = "🎵";
    }
  }
</script>

</body>
</html>
